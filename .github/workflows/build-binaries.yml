name: Build and Release Binaries

on:
  push:
    branches: [ "24.x" ]
    tags:
      - 'v*'
  workflow_dispatch: # Enable manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install build-essential libtool autotools-dev automake pkg-config bsdmainutils curl git python3 bison
    - name: Build Depends
      run: |
        cd depends
        make HOST=x86_64-pc-linux-gnu NO_QT=1 -j$(nproc)
    - name: Build Wallet
      run: |
        ./autogen.sh
        CONFIG_SITE=$PWD/depends/x86_64-pc-linux-gnu/share/config.site ./configure --prefix=$PWD/depends/x86_64-pc-linux-gnu --disable-tests --disable-bench
        make -j$(nproc)
    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: mateable-linux-x64
        path: |
          src/mateabled
          src/mateable-cli

  build-arm64:
    name: Linux ARM64
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install build-essential libtool autotools-dev automake pkg-config bsdmainutils curl git python3 bison g++-aarch64-linux-gnu
    - name: Build Depends
      run: |
        cd depends
        make HOST=aarch64-linux-gnu NO_QT=1 -j$(nproc)
    - name: Build Wallet
      run: |
        ./autogen.sh
        CONFIG_SITE=$PWD/depends/aarch64-linux-gnu/share/config.site ./configure --prefix=$PWD/depends/aarch64-linux-gnu --disable-tests --disable-bench
        make -j$(nproc)
    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: mateable-linux-arm64
        path: |
          src/mateabled
          src/mateable-cli

  build-windows:
    name: Windows x64
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install build-essential libtool autotools-dev automake pkg-config bsdmainutils curl git python3 nsis g++-mingw-w64-x86-64 bison
    - name: Build Depends
      run: |
        cd depends
        make HOST=x86_64-w64-mingw32 -j$(nproc)
    - name: Build Wallet
      run: |
        ./autogen.sh
        CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site ./configure --prefix=$PWD/depends/x86_64-w64-mingw32 --disable-tests --disable-bench
        make -j$(nproc)
        make deploy
    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: mateable-windows-x64
        path: |
          release/*.exe
          src/mateabled.exe
          src/mateable-cli.exe
          src/qt/mateable-qt.exe

  build-mac:
    name: macOS Native
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install automake libtool boost pkg-config libevent qt@5 miniupnpc libnatpmp ccache zeromq qrencode bison flex
    - name: Build Wallet
      run: |
        ./autogen.sh
        ./configure --without-bdb --with-gui=yes --disable-tests --disable-bench
        make -j$(sysctl -n hw.ncpu)
        make deploy || echo "Deploy failed, checking for binaries"
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: mateable-mac-dmg
        path: |
          ./*.dmg
          src/mateabled
          src/mateable-cli
          src/qt/mateable-qt

  create-release:
    name: Create Release
    needs: [build-linux, build-arm64, build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          mateable-linux-x64/*
          mateable-linux-arm64/*
          mateable-windows-x64/*
          mateable-mac-dmg/*
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: false
        body: |
          ### Mandatory Update for Staking Stability
          This release implements a major protocol upgrade including SegWit and Taproot support.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
