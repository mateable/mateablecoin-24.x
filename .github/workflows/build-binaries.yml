name: Build and Release Binaries

on:
  push:
    branches: [ "24.x" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libtool autotools-dev automake pkg-config \
          bsdmainutils curl git python3 bison

    - name: Build Depends
      run: |
        cd depends
        make HOST=x86_64-pc-linux-gnu NO_QT=1 -j$(nproc)

    - name: Build Wallet
      run: |
        ./autogen.sh
        CONFIG_SITE=$PWD/depends/x86_64-pc-linux-gnu/share/config.site \
        ./configure --prefix=$PWD/depends/x86_64-pc-linux-gnu \
          --disable-tests --disable-bench
        make -j$(nproc)

    - name: Upload Linux x64
      uses: actions/upload-artifact@v4
      with:
        name: mateable-linux-x64
        path: |
          src/mateabled
          src/mateable-cli


  build-arm64:
    name: Linux ARM64
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libtool autotools-dev automake pkg-config \
          bsdmainutils curl git python3 bison g++-aarch64-linux-gnu

    - name: Build Depends
      run: |
        cd depends
        make HOST=aarch64-linux-gnu NO_QT=1 -j$(nproc)

    - name: Build Wallet
      run: |
        ./autogen.sh
        CONFIG_SITE=$PWD/depends/aarch64-linux-gnu/share/config.site \
        ./configure --prefix=$PWD/depends/aarch64-linux-gnu \
          --disable-tests --disable-bench
        make -j$(nproc)

    - name: Upload Linux ARM64
      uses: actions/upload-artifact@v4
      with:
        name: mateable-linux-arm64
        path: |
          src/mateabled
          src/mateable-cli


  build-windows:
    name: Windows x64 (cross-compile)
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libtool autotools-dev automake pkg-config \
          bsdmainutils curl git python3 nsis \
          g++-mingw-w64-x86-64 bison

    - name: Build Depends
      run: |
        cd depends
        make HOST=x86_64-w64-mingw32 -j$(nproc)

    - name: Build Wallet
      run: |
        ./autogen.sh
        CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
        ./configure --prefix=$PWD/depends/x86_64-w64-mingw32 \
          --disable-bench
        make -j$(nproc)
        make deploy

    - name: Upload Windows
      uses: actions/upload-artifact@v4
      with:
        name: mateable-windows-x64
        path: |
          *-win64-setup.exe
          src/mateabled.exe
          src/mateable-cli.exe
          src/mateable-tx.exe
          src/mateable-util.exe
          src/mateable-wallet.exe
          src/qt/mateable-qt.exe


  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        brew install autoconf automake libtool pkg-config python3 bison

        echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

        python3 -m venv /tmp/venv
        source /tmp/venv/bin/activate

        python -m pip install --upgrade pip setuptools wheel

        echo "/tmp/venv/bin" >> $GITHUB_PATH

    - name: Build Depends
      run: |
        cd depends
        make HOST=arm64-apple-darwin -j$(sysctl -n hw.logicalcpu)

    - name: Build Wallet
      run: |
        ./autogen.sh
        export CFLAGS="-std=gnu11"
        export CXXFLAGS="-std=gnu++17 -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION -Wno-error=deprecated-builtins -Wno-enum-constexpr-conversion"
        CONFIG_SITE=$PWD/depends/arm64-apple-darwin/share/config.site \
        ./configure --prefix=$PWD/depends/arm64-apple-darwin \
          --disable-tests --disable-bench
        make -j$(sysctl -n hw.logicalcpu)

    - name: Upload macOS ARM64
      uses: actions/upload-artifact@v4
      with:
        name: mateable-macos-arm64
        path: |
          src/mateabled
          src/mateable-cli
          src/qt/mateable-qt


  package:
    name: Package Artifacts
    needs: [build-linux, build-arm64, build-windows, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Package by platform
      run: |
        VERSION=${{ github.ref_name }}
        mkdir release

        tar -czf release/mateable-${VERSION}-linux-x86_64.tar.gz \
          -C dist/mateable-linux-x64 .

        tar -czf release/mateable-${VERSION}-linux-arm64.tar.gz \
          -C dist/mateable-linux-arm64 .

        tar -czf release/mateable-${VERSION}-macos-arm64.tar.gz \
          -C dist/mateable-macos-arm64 .

        tar -czf release/mateable-${VERSION}-macos-x86_64.tar.gz \
          -C dist/mateable-macos-x64 .

        cd dist/mateable-windows-x64
        find . -name 'test_mateable*' -delete
        zip -r ../../release/mateable-${VERSION}-windows-x86_64.zip .

    - name: Upload packaged release files
      uses: actions/upload-artifact@v4
      with:
        name: mateable-${{ github.ref_name }}-all-platforms
        path: release/*


  build-macos-x64:
    name: macOS Intel
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        brew install autoconf automake libtool pkg-config python3 bison

        echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

        python3 -m venv /tmp/venv
        source /tmp/venv/bin/activate

        python -m pip install --upgrade pip setuptools wheel

        echo "/tmp/venv/bin" >> $GITHUB_PATH

    - name: Build Depends
      run: |
        cd depends
        make HOST=x86_64-apple-darwin -j$(sysctl -n hw.logicalcpu)

    - name: Build Wallet
      run: |
        ./autogen.sh
        export CFLAGS="-std=gnu11"
        export CXXFLAGS="-std=gnu++17 -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION -Wno-error=deprecated-builtins -Wno-enum-constexpr-conversion"
        CONFIG_SITE=$PWD/depends/x86_64-apple-darwin/share/config.site \
        ./configure --prefix=$PWD/depends/x86_64-apple-darwin \
          --disable-tests --disable-bench
        make -j$(sysctl -n hw.logicalcpu)

    - name: Upload macOS x64
      uses: actions/upload-artifact@v4
      with:
        name: mateable-macos-x64
        path: |
          src/mateabled
          src/mateable-cli
          src/qt/mateable-qt


